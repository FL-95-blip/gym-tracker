<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; }
    .header { background: white; border-bottom: 1px solid #e5e7eb; padding: 1rem; sticky: top 0; position: sticky; top: 0; z-index: 20; }
    .header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .header p { font-size: 0.875rem; color: #6b7280; }
    .tabs { display: flex; border-top: 1px solid #e5e7eb; background: white; }
    .tab { flex: 1; padding: 1rem 0.5rem; border: none; background: white; cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; }
    .tab.active { border-bottom-color: #2563eb; color: #2563eb; }
    .content { display: none; padding: 1rem; padding-bottom: 5rem; }
    .content.active { display: block; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 500; margin-bottom: 0.5rem; font-size: 0.875rem; }
    input, select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.875rem; }
    input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    button { padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; font-weight: 500; font-size: 0.875rem; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: white; width: 100%; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #fee2e2; color: #dc2626; width: 100%; }
    .btn-danger:hover { background: #fecaca; }
    .btn-small { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .day-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .day-btn { background: #d1d5db; color: #374151; padding: 0.5rem; border-radius: 0.375rem; border: none; cursor: pointer; font-weight: 500; }
    .day-btn.active { background: #2563eb; color: white; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
    .card-title { font-weight: 600; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; background: #dcfce7; color: #166534; }
    .info-box { background: #dbeafe; border: 1px solid #bfdbfe; padding: 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; color: #1e40af; margin-bottom: 0.5rem; }
    .input-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
    .empty { text-align: center; padding: 2rem; color: #6b7280; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .divider { border-top: 1px solid #e5e7eb; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gym Tracker</h1>
    <p>Registra tu progresión</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="tab('entrada')">📝 Entrada</button>
    <button class="tab" onclick="tab('rutina')">⚙️ Rutina</button>
    <button class="tab" onclick="tab('historico')">📊 Histórico</button>
  </div>

  <!-- ENTRADA -->
  <div id="entrada" class="content active">
    <div class="form-group">
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="form-group" id="dayButtons"></div>
    <div id="exercises"></div>
  </div>

  <!-- RUTINA -->
  <div id="rutina" class="content">
    <div class="form-group">
      <label>Crear día</label>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="newDay" placeholder="Día 5">
        <button class="btn-primary btn-small" onclick="crearDia()">+</button>
      </div>
    </div>
    <div id="dias"></div>
    <div class="divider" style="margin: 1rem 0;"></div>
    <div class="form-group">
      <label>Nuevo ejercicio</label>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="newExercise" placeholder="Nombre">
        <button class="btn-success btn-small" onclick="addExercise()">+</button>
      </div>
    </div>
  </div>

  <!-- HISTORICO -->
  <div id="historico" class="content">
    <div id="hist"></div>
  </div>

  <script>
    let app = {
      records: JSON.parse(localStorage.getItem('records') || '[]'),
      rutina: JSON.parse(localStorage.getItem('rutina') || '{"Día 1":["Sentadillas","Flexiones de brazo","Peso muerto","Remo barra","Dominada barra","Curl con mancuerna","Prensa + flexión isquio","Vuelos laterales"],"Día 2":["Press de pecho","Jalón","Press inclinado","Extensión cuadríceps","Sentadilla búlgara","Fondos","Flexiones","Bícep martillo","Remo 1 brazo"],"Día 3":["Hip thrust","Front squat","Peso muerto rumano","Face pull","Aperturas polea","Pull over polea","Trícep polea bajo"],"Día 4":["Press militar","Remo con barra","Vuelos laterales"]}'),
      exercises: JSON.parse(localStorage.getItem('exercises') || '["Sentadillas","Flexiones de brazo","Peso muerto","Remo barra","Dominada barra","Curl con mancuerna","Press de pecho","Jalón","Press inclinado","Extensión cuadríceps","Sentadilla búlgara","Fondos","Flexiones","Bícep martillo","Remo 1 brazo","Hip thrust","Front squat","Peso muerto rumano","Face pull","Aperturas polea","Pull over polea","Trícep polea bajo","Press militar","Vuelos laterales","Prensa + flexión isquio"]'),
      day: 'Día 1',
      date: new Date().toISOString().split('T')[0]
    };

    function save() {
      localStorage.setItem('records', JSON.stringify(app.records));
      localStorage.setItem('rutina', JSON.stringify(app.rutina));
      localStorage.setItem('exercises', JSON.stringify(app.exercises));
    }

    function tab(t) {
      document.querySelectorAll('.content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
      document.getElementById(t).classList.add('active');
      event.target.classList.add('active');
      render();
    }

    function split(arr) {
      let r = [];
      arr.forEach(e => {
        if (e.includes('+')) r.push(...e.split('+').map(x => x.trim()));
        else r.push(e);
      });
      return r;
    }

    function last(ex) {
      let f = app.records.filter(r => r.exercise === ex).sort((a,b) => new Date(b.date) - new Date(a.date));
      return f[0] || null;
    }

    function addRec(ex) {
      let s = document.getElementById('s_' + ex).value;
      let r = document.getElementById('r_' + ex).value;
      let w = document.getElementById('w_' + ex).value;
      if (!s || !r || !w) return;
      app.records.push({id: Date.now(), date: app.date, day: app.day, exercise: ex, sets: parseInt(s), reps: parseInt(r), weight: parseFloat(w)});
      document.getElementById('s_' + ex).value = '';
      document.getElementById('r_' + ex).value = '';
      document.getElementById('w_' + ex).value = '';
      save();
      render();
    }

    function delRec(id) {
      app.records = app.records.filter(r => r.id !== id);
      save();
      render();
    }

    function render() {
      document.getElementById('fecha').value = app.date;

      let h = Object.keys(app.rutina).map(d => `<button class="day-btn ${app.day===d?'active':''}" onclick="app.day='${d}';render()">${d}</button>`).join('');
      document.getElementById('dayButtons').innerHTML = `<div class="day-grid">${h}</div>`;

      let exs = split(app.rutina[app.day] || []);
      let reg = app.records.filter(r => r.date === app.date && r.day === app.day).map(r => r.exercise);
      let html = exs.map(ex => {
        let isReg = reg.includes(ex);
        let rec = app.records.find(r => r.exercise === ex && r.date === app.date && r.day === app.day);
        let l = last(ex);
        return `<div class="card"><div class="card-title"><span>${ex}</span>${isReg?'<span class="badge">✓</span>':''}</div>${isReg && rec ? `<div class="info-box">${rec.sets}s × ${rec.reps}r @ ${rec.weight}kg</div>` : ''}${!isReg ? `${l?`<div class="info-box">Último: ${l.sets}s × ${l.reps}r @ ${l.weight}kg (${l.date})</div>`:''}
        <div class="input-row"><input type="number" id="s_${ex}" placeholder="Sets"><input type="number" id="r_${ex}" placeholder="Reps"><input type="number" id="w_${ex}" step="0.5" placeholder="Peso"></div>
        <button class="btn-success" onclick="addRec('${ex}')">Agregar</button>` : `<button class="btn-danger" onclick="delRec(${rec.id})">Eliminar</button>`}</div>`;
      }).join('');
      document.getElementById('exercises').innerHTML = html;

      let dias = Object.entries(app.rutina).map(([d, exs]) => `<div class="card"><div class="card-title"><span>${d}</span><button class="btn-danger btn-small" onclick="delete app.rutina['${d}'];save();render()">🗑️</button></div>${exs.map(e => `<div style="background:#f9fafb;padding:0.5rem;border-radius:0.25rem;margin:0.5rem 0;display:flex;justify-content:space-between;"><span>${e}</span><button class="btn-small" style="background:#fee2e2;color:#dc2626;" onclick="app.rutina['${d}'].splice(app.rutina['${d}'].indexOf('${e}'),1);save();render()">✕</button></div>`).join('')}<select onchange="app.rutina['${d}'].includes(this.value) || app.rutina['${d}'].push(this.value);this.value='';save();render()"><option>+ Agregar</option>${app.exercises.map(e => `<option value="${e}">${e}</option>`).join('')}</select></div>`).join('');
      document.getElementById('dias').innerHTML = dias;

      let byEx = {};
      app.records.forEach(r => {
        if(!byEx[r.exercise]) byEx[r.exercise] = [];
        byEx[r.exercise].push(r);
      });
      let hist = Object.keys(byEx).length === 0 ? '<div class="empty">Sin registros</div>' : Object.entries(byEx).map(([ex, recs]) => `<div class="card"><div class="card-title"><span>${ex}</span><span style="background:#f3f4f6;color:#6b7280;display:inline-block;padding:0.25rem 0.5rem;border-radius:0.25rem;font-size:0.75rem;">${recs.length}</span></div>${recs.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => `<div style="background:#f9fafb;padding:0.5rem;border-radius:0.25rem;margin:0.5rem 0;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:500;">${r.day}</div><div style="font-size:0.75rem;color:#6b7280;">${r.date}</div><span style="background:#dbeafe;color:#1e40af;padding:0.25rem 0.5rem;border-radius:0.25rem;font-size:0.75rem;display:inline-block;margin-top:0.25rem;">${r.sets}s × ${r.reps}r @ ${r.weight}kg</span></div><button class="btn-small" style="background:#fee2e2;color:#dc2626;" onclick="delRec(${r.id})">🗑️</button></div>`).join('')}</div>`).join('');
      document.getElementById('hist').innerHTML = hist;
    }

    function crearDia() {
      let n = document.getElementById('newDay').value;
      if(!n || app.rutina[n]) return;
      app.rutina[n] = [];
      document.getElementById('newDay').value = '';
      save();
      render();
    }

    function addExercise() {
      let n = document.getElementById('newExercise').value;
      if(!n || app.exercises.includes(n)) return;
      app.exercises.push(n);
      document.getElementById('newExercise').value = '';
      save();
      render();
    }

    document.getElementById('fecha').addEventListener('change', e => {
      app.date = e.target.value;
      render();
    });

    render();
  </script>
</body>
</html>

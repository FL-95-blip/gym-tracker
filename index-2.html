<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Gym Tracker&quot;,&quot;short_name&quot;:&quot;Gym&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;theme_color&quot;:&quot;#2563eb&quot;,&quot;background_color&quot;:&quot;#ffffff&quot;}">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Iconos simples en SVG
    const TrashIcon = () => (
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="3 6 3 14 13 14 13 6"></polyline>
        <path d="M10 9v4M6 9v4M5 6H3v-1a1 1 0 011-1h8a1 1 0 011 1v1h-2"></path>
      </svg>
    );

    const PlusIcon = () => (
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="8" y1="3" x2="8" y2="13"></line>
        <line x1="3" y1="8" x2="13" y2="8"></line>
      </svg>
    );

    const XIcon = () => (
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="3" y1="3" x2="13" y2="13"></line>
        <line x1="13" y1="3" x2="3" y2="13"></line>
      </svg>
    );

    const GymTracker = () => {
      const [activeTab, setActiveTab] = useState('entrada');
      const [selectedDay, setSelectedDay] = useState('Día 1');
      const [records, setRecords] = useState([]);
      const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
      const [formValues, setFormValues] = useState({});
      const [rutina, setRutina] = useState({});
      const [allExercises, setAllExercises] = useState([]);
      const [newExerciseName, setNewExerciseName] = useState('');
      const [newDayName, setNewDayName] = useState('');

      const commonExercises = [
        'Sentadillas',
        'Flexiones de brazo',
        'Peso muerto',
        'Remo barra',
        'Dominada barra',
        'Curl con mancuerna',
        'Press de pecho',
        'Jalón',
        'Press inclinado',
        'Extensión cuadríceps',
        'Sentadilla búlgara',
        'Fondos',
        'Flexiones',
        'Bícep martillo',
        'Remo 1 brazo',
        'Hip thrust',
        'Front squat',
        'Peso muerto rumano',
        'Face pull',
        'Aperturas polea',
        'Pull over polea',
        'Trícep polea bajo',
        'Press militar',
        'Vuelos laterales',
        'Prensa + flexión isquio'
      ];

      // Cargar datos
      useEffect(() => {
        const savedRecords = localStorage.getItem('gymRecords');
        const savedRutina = localStorage.getItem('gymRutina');
        const savedExercises = localStorage.getItem('gymAllExercises');

        if (savedRecords) setRecords(JSON.parse(savedRecords));
        if (savedRutina) setRutina(JSON.parse(savedRutina));
        if (savedExercises) {
          setAllExercises(JSON.parse(savedExercises));
        } else {
          setAllExercises(commonExercises);
        }
      }, []);

      // Guardar datos
      useEffect(() => {
        localStorage.setItem('gymRecords', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('gymRutina', JSON.stringify(rutina));
      }, [rutina]);

      useEffect(() => {
        localStorage.setItem('gymAllExercises', JSON.stringify(allExercises));
      }, [allExercises]);

      // Inicializar rutina por defecto
      useEffect(() => {
        if (Object.keys(rutina).length === 0) {
          const defaultRutina = {
            'Día 1': [
              'Sentadillas',
              'Flexiones de brazo',
              'Peso muerto',
              'Remo barra',
              'Dominada barra',
              'Curl con mancuerna',
              'Prensa + flexión isquio',
              'Vuelos laterales'
            ],
            'Día 2': [
              'Press de pecho',
              'Jalón',
              'Press inclinado',
              'Extensión cuadríceps',
              'Sentadilla búlgara',
              'Fondos',
              'Flexiones',
              'Bícep martillo',
              'Remo 1 brazo'
            ],
            'Día 3': [
              'Hip thrust',
              'Front squat',
              'Peso muerto rumano',
              'Face pull',
              'Aperturas polea',
              'Pull over polea',
              'Trícep polea bajo'
            ],
            'Día 4': [
              'Press militar',
              'Remo con barra',
              'Vuelos laterales'
            ]
          };
          setRutina(defaultRutina);
        }
      }, []);

      const splitExercises = (exercises) => {
        const expanded = [];
        exercises.forEach(ex => {
          if (ex.includes('+')) {
            const parts = ex.split('+').map(p => p.trim());
            expanded.push(...parts);
          } else {
            expanded.push(ex);
          }
        });
        return expanded;
      };

      const getLastRecordForExercise = (exercise) => {
        const filtered = records.filter(r => r.exercise === exercise);
        if (filtered.length === 0) return null;
        return filtered.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      };

      const addRecord = (day, exercise, sets, reps, weight) => {
        if (!sets || !reps || !weight) return;
        const newRecord = {
          id: Date.now(),
          date: currentDate,
          day: day,
          exercise: exercise,
          sets: parseInt(sets),
          reps: parseInt(reps),
          weight: parseFloat(weight)
        };
        setRecords([...records, newRecord]);
        setFormValues({...formValues, [exercise]: { sets: '', reps: '', weight: '' }});
      };

      const deleteRecord = (recordId) => {
        setRecords(records.filter(r => r.id !== recordId));
      };

      const addNewExercise = () => {
        if (newExerciseName.trim() && !allExercises.includes(newExerciseName)) {
          setAllExercises([...allExercises, newExerciseName]);
          setNewExerciseName('');
        }
      };

      const addExerciseToDay = (day, exercise) => {
        if (!rutina[day].includes(exercise)) {
          setRutina({
            ...rutina,
            [day]: [...rutina[day], exercise]
          });
        }
      };

      const removeExerciseFromDay = (day, exercise) => {
        setRutina({
          ...rutina,
          [day]: rutina[day].filter(ex => ex !== exercise)
        });
      };

      const createNewDay = () => {
        if (newDayName.trim() && !rutina[newDayName]) {
          setRutina({
            ...rutina,
            [newDayName]: []
          });
          setNewDayName('');
        }
      };

      const deleteDay = (dayName) => {
        const newRutina = {...rutina};
        delete newRutina[dayName];
        setRutina(newRutina);
        if (selectedDay === dayName) {
          setSelectedDay(Object.keys(newRutina)[0] || 'Día 1');
        }
      };

      const todayRecords = records.filter(r => r.date === currentDate && r.day === selectedDay);

      // VISTA: Entrada
      const EntradaView = () => {
        const currentRutina = rutina[selectedDay] || [];
        const expandedExercises = splitExercises(currentRutina);
        const registeredExercisesToday = todayRecords.map(r => r.exercise);

        return (
          <div className="space-y-4 pb-20">
            <div className="sticky top-0 bg-white z-10 p-4 border-b">
              <label className="block text-sm font-medium text-gray-700 mb-2">Fecha</label>
              <input 
                type="date" 
                value={currentDate}
                onChange={(e) => setCurrentDate(e.target.value)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
              />
            </div>

            <div className="px-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">Día de rutina</label>
              <div className="grid grid-cols-2 gap-2 md:grid-cols-4">
                {Object.keys(rutina).map(day => (
                  <button
                    key={day}
                    onClick={() => setSelectedDay(day)}
                    className={`py-2 px-2 rounded-lg text-sm font-medium transition ${
                      selectedDay === day
                        ? 'bg-blue-600 text-white'
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    {day}
                  </button>
                ))}
              </div>
            </div>

            <div className="px-4">
              <h3 className="text-sm font-medium text-gray-700 mb-3">Ejercicios del {selectedDay}</h3>
              <div className="space-y-4">
                {expandedExercises.map(exercise => {
                  const isRegistered = registeredExercisesToday.includes(exercise);
                  const record = records.find(r => r.exercise === exercise && r.date === currentDate && r.day === selectedDay);
                  const lastRecord = getLastRecordForExercise(exercise);
                  const formKey = `${selectedDay}_${exercise}`;
                  const formVal = formValues[formKey] || { sets: '', reps: '', weight: '' };

                  const defaultSets = formVal.sets || (lastRecord ? lastRecord.sets : '');
                  const defaultReps = formVal.reps || (lastRecord ? lastRecord.reps : '');
                  const defaultWeight = formVal.weight || (lastRecord ? lastRecord.weight : '');

                  return (
                    <div key={exercise} className="bg-white border border-gray-200 rounded-lg p-4">
                      <div className="flex items-center justify-between mb-3">
                        <h4 className="font-medium text-gray-900">{exercise}</h4>
                        {isRegistered && <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">✓</span>}
                      </div>

                      {isRegistered && record ? (
                        <div className="bg-green-50 border border-green-200 rounded p-3 mb-3">
                          <p className="text-sm text-green-800">
                            <span className="font-semibold">{record.sets}s × {record.reps}r @ {record.weight}kg</span>
                          </p>
                        </div>
                      ) : null}

                      {!isRegistered && (
                        <>
                          {lastRecord && (
                            <div className="mb-3 p-2 bg-blue-50 border border-blue-200 rounded text-xs text-blue-700">
                              Último: {lastRecord.sets}s × {lastRecord.reps}r @ {lastRecord.weight}kg ({lastRecord.date})
                            </div>
                          )}
                          
                          <div className="grid grid-cols-3 gap-2 mb-3">
                            <div>
                              <label className="block text-xs text-gray-600 mb-1">Sets</label>
                              <input
                                type="number"
                                value={defaultSets}
                                onChange={(e) => setFormValues({
                                  ...formValues,
                                  [formKey]: {...formVal, sets: e.target.value}
                                })}
                                placeholder="3"
                                className="w-full px-2 py-2 border border-gray-300 rounded text-sm"
                              />
                            </div>
                            <div>
                              <label className="block text-xs text-gray-600 mb-1">Reps</label>
                              <input
                                type="number"
                                value={defaultReps}
                                onChange={(e) => setFormValues({
                                  ...formValues,
                                  [formKey]: {...formVal, reps: e.target.value}
                                })}
                                placeholder="8"
                                className="w-full px-2 py-2 border border-gray-300 rounded text-sm"
                              />
                            </div>
                            <div>
                              <label className="block text-xs text-gray-600 mb-1">Peso (kg)</label>
                              <input
                                type="number"
                                step="0.5"
                                value={defaultWeight}
                                onChange={(e) => setFormValues({
                                  ...formValues,
                                  [formKey]: {...formVal, weight: e.target.value}
                                })}
                                placeholder="50"
                                className="w-full px-2 py-2 border border-gray-300 rounded text-sm"
                              />
                            </div>
                          </div>
                          <button
                            onClick={() => addRecord(selectedDay, exercise, defaultSets, defaultReps, defaultWeight)}
                            className="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded text-sm font-medium transition"
                          >
                            Agregar
                          </button>
                        </>
                      )}

                      {isRegistered && (
                        <button
                          onClick={() => {
                            setRecords(records.filter(r => !(r.exercise === exercise && r.date === currentDate && r.day === selectedDay)));
                          }}
                          className="w-full bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded text-sm font-medium transition flex items-center justify-center gap-2"
                        >
                          <TrashIcon /> Eliminar
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      // VISTA: Rutina
      const RutinaView = () => {
        return (
          <div className="space-y-4 pb-20">
            <div className="p-4 border-b sticky top-0 bg-white z-10">
              <h2 className="text-lg font-bold text-gray-900 mb-3">Mis Días de Rutina</h2>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newDayName}
                  onChange={(e) => setNewDayName(e.target.value)}
                  placeholder="Ej: Día 5"
                  className="flex-1 px-2 py-2 border border-gray-300 rounded text-sm"
                />
                <button
                  onClick={createNewDay}
                  className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-medium transition"
                >
                  <PlusIcon />
                </button>
              </div>
            </div>

            <div className="px-4 space-y-4">
              {Object.entries(rutina).map(([dayName, exercises]) => (
                <div key={dayName} className="border border-gray-200 rounded-lg overflow-hidden">
                  <div className="bg-gray-100 p-3 flex justify-between items-center">
                    <h3 className="font-semibold text-gray-900">{dayName}</h3>
                    <button
                      onClick={() => deleteDay(dayName)}
                      className="text-red-600 hover:text-red-800"
                    >
                      <TrashIcon />
                    </button>
                  </div>

                  <div className="p-4 space-y-2">
                    {exercises.map((ex, idx) => (
                      <div key={idx} className="flex items-center justify-between bg-gray-50 p-2 rounded text-sm">
                        <span className="text-gray-700">{ex}</span>
                        <button
                          onClick={() => removeExerciseFromDay(dayName, ex)}
                          className="text-red-500 hover:text-red-700"
                        >
                          <XIcon />
                        </button>
                      </div>
                    ))}

                    <div className="pt-2 border-t mt-3">
                      <select
                        onChange={(e) => {
                          if (e.target.value) {
                            addExerciseToDay(dayName, e.target.value);
                            e.target.value = '';
                          }
                        }}
                        className="w-full px-2 py-2 border border-gray-300 rounded text-sm"
                      >
                        <option value="">+ Agregar ejercicio</option>
                        {allExercises.map(ex => (
                          <option key={ex} value={ex}>
                            {ex}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div className="px-4 pb-4 border-t pt-4">
              <h3 className="text-sm font-semibold text-gray-900 mb-3">Agregar nuevo ejercicio</h3>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newExerciseName}
                  onChange={(e) => setNewExerciseName(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && addNewExercise()}
                  placeholder="Nombre del ejercicio"
                  className="flex-1 px-2 py-2 border border-gray-300 rounded text-sm"
                />
                <button
                  onClick={addNewExercise}
                  className="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm font-medium transition"
                >
                  <PlusIcon />
                </button>
              </div>
            </div>
          </div>
        );
      };

      // VISTA: Histórico
      const HistoricoView = () => {
        const recordsByExercise = {};
        records.forEach(r => {
          if (!recordsByExercise[r.exercise]) {
            recordsByExercise[r.exercise] = [];
          }
          recordsByExercise[r.exercise].push(r);
        });

        return (
          <div className="space-y-4 pb-20 p-4">
            <h2 className="text-lg font-bold text-gray-900 mb-4">Histórico</h2>
            
            {Object.keys(recordsByExercise).length === 0 ? (
              <p className="text-center text-gray-500 py-8">Sin registros aún</p>
            ) : (
              Object.entries(recordsByExercise).map(([exercise, exerciseRecords]) => (
                <div key={exercise} className="border border-gray-200 rounded-lg overflow-hidden">
                  <div className="bg-gray-100 p-3">
                    <h3 className="font-semibold text-gray-900">{exercise}</h3>
                    <p className="text-xs text-gray-600 mt-1">{exerciseRecords.length} registro(s)</p>
                  </div>
                  <div className="divide-y">
                    {exerciseRecords
                      .sort((a, b) => new Date(b.date) - new Date(a.date))
                      .map(record => (
                        <div key={record.id} className="p-3 text-sm">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <p className="text-gray-700">{record.day}</p>
                              <p className="text-xs text-gray-500">{record.date}</p>
                            </div>
                            <button
                              onClick={() => deleteRecord(record.id)}
                              className="text-red-600 hover:text-red-800 transition"
                              title="Eliminar"
                            >
                              <TrashIcon />
                            </button>
                          </div>
                          <span className="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-medium">
                            {record.sets}s × {record.reps}r @ {record.weight}kg
                          </span>
                        </div>
                      ))}
                  </div>
                </div>
              ))
            )}
          </div>
        );
      };

      return (
        <div className="bg-gray-50 min-h-screen font-sans">
          <div className="bg-white border-b sticky top-0 z-20">
            <div className="p-4">
              <h1 className="text-2xl font-bold text-gray-900">Gym Tracker</h1>
              <p className="text-sm text-gray-600">Registra tu progresión</p>
            </div>
            
            <div className="flex border-t overflow-x-auto">
              <button
                onClick={() => setActiveTab('entrada')}
                className={`flex-1 py-3 text-center font-medium transition text-sm ${
                  activeTab === 'entrada'
                    ? 'border-b-2 border-blue-600 text-blue-600'
                    : 'text-gray-600 border-b-2 border-transparent'
                }`}
              >
                📝 Entrada
              </button>
              <button
                onClick={() => setActiveTab('rutina')}
                className={`flex-1 py-3 text-center font-medium transition text-sm ${
                  activeTab === 'rutina'
                    ? 'border-b-2 border-blue-600 text-blue-600'
                    : 'text-gray-600 border-b-2 border-transparent'
                }`}
              >
                ⚙️ Rutina
              </button>
              <button
                onClick={() => setActiveTab('historico')}
                className={`flex-1 py-3 text-center font-medium transition text-sm ${
                  activeTab === 'historico'
                    ? 'border-b-2 border-blue-600 text-blue-600'
                    : 'text-gray-600 border-b-2 border-transparent'
                }`}
              >
                📊 Histórico
              </button>
            </div>
          </div>

          {activeTab === 'entrada' && <EntradaView />}
          {activeTab === 'rutina' && <RutinaView />}
          {activeTab === 'historico' && <HistoricoView />}
        </div>
      );
    };

    ReactDOM.render(<GymTracker />, document.getElementById('root'));
  </script>
</body>
</html>
